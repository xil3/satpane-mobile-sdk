plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.satpane'
version = '0.1.2'

android {
  namespace "com.satpane.enhancenative"
  defaultConfig {
    versionCode 3
    versionName '0.1.2'
    // Keeps ONNX Runtime's classes in apps that shrink their release builds (R8): its native code looks
    // them up by name, and a renamed class aborts the app on the first model run.
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  // ONNX Runtime (Microsoft, MIT): runs the model on the phone's CPU with XNNPACK. The Satpane SDK's own
  // sources (com.satpane.enhance) are copied into src/ when this package is packed.
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
}
